[project]
name = "package-e-commerce-project"
version = "0.1.0"
description = ""
authors = [
    {name = "maxim",email = "mcsim55555k@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pip (>=26.0.1,<27.0.0)",
    "shell (>=1.0.1,<2.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "mypy (>=1.20.2,<2.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pytest (>=9.0.3,<10.0.0)"
]

[tool.poetry]
packages = [{include = "package_e_commerce_project", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''.git'''

[tool.isort]
# Максимальная длина строки
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = '''.venv'''

[dependency-groups]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)"
]
